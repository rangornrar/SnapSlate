name: Build

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # Restore and build must agree on configuration, platform and ReadyToRun.
      # The installer also builds without ReadyToRun; publishing may opt in separately.
      - name: Restore
        run: dotnet restore .\SnapSlate.csproj -p:Configuration=Release -p:Platform=x64 -r win-x64 -p:PublishReadyToRun=false
      - name: Build
        run: dotnet build .\SnapSlate.csproj -c Release -p:Platform=x64 -r win-x64 -p:PublishReadyToRun=false --no-restore
      - name: Test persistence and text exports
        run: dotnet test .\tests\SnapSlate.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/TestResults/*.trx
          if-no-files-found: ignore
